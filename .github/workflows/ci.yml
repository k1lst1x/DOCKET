name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCKET_DATABASE_URL: sqlite:////tmp/docket-ci.db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked --extra agent
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m unittest discover -s tests
      - name: SQLite migration checks
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: API and SDK smoke check
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from strands import Agent
          from app.main import app
          with TestClient(app) as client:
              response = client.get('/api/v1/health')
              assert response.status_code == 200
              assert response.json() == {'status': 'ok', 'service': 'docket-api'}
              assert '/api/v1/health' in client.get('/openapi.json').json()['paths']
              allowed = client.options('/api/v1/health', headers={
                  'Origin': 'http://localhost:5173',
                  'Access-Control-Request-Method': 'GET',
              })
              assert allowed.headers['access-control-allow-origin'] == 'http://localhost:5173'
              denied = client.options('/api/v1/health', headers={
                  'Origin': 'https://untrusted.example',
                  'Access-Control-Request-Method': 'GET',
              })
              assert 'access-control-allow-origin' not in denied.headers
          PY

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Build static Pages export
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static frontend
        id: deployment
        uses: actions/deploy-pages@v4

  pages-smoke-test:
    name: Verify deployed Pages site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published homepage
        env:
          PAGES_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: |
          test -n "$PAGES_URL"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$PAGES_URL" \
            | grep -q "Docket"
