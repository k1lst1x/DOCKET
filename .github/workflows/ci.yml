name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Keep this name stable: repository rules require the "Backend checks" status.
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docket
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: docket/uv.lock
      - run: uv python install 3.11
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - run: uv run python -m compileall -q api core agentcore_chat.py agentcore_pipeline.py
      - name: FastAPI and Strands smoke check
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from strands import Agent
          from api.main import app
          with TestClient(app) as client:
              assert '/chat' in client.get('/openapi.json').json()['paths']
              assert client.post('/generate', json={'topic': 'Budget', 'kind': 'summary'}).status_code == 401
          PY

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Build original frontend for Pages
        run: npm run build:pages
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out-pages

  deploy-pages:
    name: Deploy GitHub Pages landing
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static landing
        id: deployment
        uses: actions/deploy-pages@v4

  pages-smoke-test:
    name: Verify deployed Pages site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published homepage
        env:
          PAGES_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: |
          test -n "$PAGES_URL"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --output /tmp/docket-home.html "$PAGES_URL"
          grep -q "Where do you live?" /tmp/docket-home.html
