# DOCKET source registry: Fremont, California.
#
# Required per entry: id, name, url, kind, crawl_strategy, parser, enabled.
# Optional: fetcher (http | firecrawl), send_user_agent (default true),
# schedule (daily | weekly | monthly), verify_pattern (regex that proves real content
# came back), params.
#
# Every URL below was fetched and its robots.txt checked on 2026-09-13.
#
# Identity policy: requests identify as DOCKET-civic-research-bot by default.
# fremont.gov (Akamai), the city's IQM2 portal and FUSD's Simbli site allow crawling in
# robots.txt, but their bot firewalls reject that User-Agent. For those sources only,
# the user decided (2026-09-13) to let Firecrawl send its default identity
# (send_user_agent: false). robots.txt rules and crawl delays are still enforced, and
# Firecrawl runs in basic proxy mode only; stealth proxies are never used.

sources:
  - id: fremont-council-iqm2
    name: City of Fremont meeting portal (IQM2) - agendas and agenda packets
    url: https://fremontcityca.iqm2.com/Citizens/Calendar.aspx
    kind: meetings
    crawl_strategy: listing_one_level
    parser: iqm2_calendar
    fetcher: firecrawl
    send_user_agent: false
    schedule: weekly
    enabled: true
    verify_pattern: 'Detail_Meeting\.aspx\?ID=\d+'
    params:
      wait_for_ms: 3000
      # robots.txt sets Crawl-delay: 60; the fetcher honors it.

  - id: fremont-agenda-center-council
    name: City of Fremont Agenda Center - City Council meetings and minutes
    url: https://www.fremont.gov/government/agenda-center/city-council-1038
    kind: meetings
    crawl_strategy: listing_one_level
    parser: civicplus_agenda_center
    fetcher: firecrawl
    send_user_agent: false
    schedule: weekly
    enabled: true
    verify_pattern: '\d{2}/\d{2}/2026 \d{1,2}:\d{2} [AP]M'
    params:
      wait_for_ms: 3000

  - id: fremont-planning-commission
    name: City of Fremont Agenda Center - Planning Commission (zoning and land use)
    url: https://www.fremont.gov/government/agenda-center/planning-commission-1048
    kind: zoning
    crawl_strategy: listing_one_level
    parser: civicplus_agenda_center
    fetcher: firecrawl
    send_user_agent: false
    schedule: weekly
    enabled: true
    verify_pattern: '\d{2}[/-]\d{2}[/-]20\d{2}'
    params:
      wait_for_ms: 3000

  - id: fremont-news
    name: City of Fremont news
    url: https://www.fremont.gov/about/news-media/fremont-news
    kind: news
    crawl_strategy: listing_one_level
    parser: civicplus_news
    fetcher: firecrawl
    send_user_agent: false
    schedule: daily
    enabled: true
    verify_pattern: '/Home/Components/News/News/\d+/1067'
    params:
      wait_for_ms: 3000

  - id: fremont-app-requests
    name: Fremont App (CitySourced) - resident service requests
    url: https://fremontca.citysourced.com/servicerequests/nearby
    kind: resident_issues
    crawl_strategy: listing_one_level
    parser: citysourced_requests
    fetcher: firecrawl
    schedule: daily
    # Replaced by fremont-app-requests-api (the portal's own JSON API over plain HTTP, no Firecrawl credits).
    enabled: false
    verify_pattern: 'CAS-\d+-[A-Z0-9]+'
    params:
      wait_for_ms: 8000

  - id: fremont-transportation
    name: City of Fremont Transportation Engineering - plans and projects
    url: https://www.fremont.gov/government/departments/transportation-engineering
    kind: transportation
    crawl_strategy: listing_one_level
    parser: civicplus_page
    fetcher: firecrawl
    send_user_agent: false
    schedule: weekly
    enabled: true
    verify_pattern: 'transportation-engineering/[a-z0-9-]+'

  - id: fusd-board-meetings
    name: Fremont Unified School District - Board of Education meetings (Simbli)
    url: https://simbli.eboardsolutions.com/SB_Meetings/SB_MeetingListing.aspx?S=36031613
    kind: schools
    crawl_strategy: listing_one_level
    parser: simbli_meetings
    fetcher: firecrawl
    send_user_agent: false
    schedule: weekly
    enabled: true
    verify_pattern: 'Meeting of the Board of Education'
    params:
      wait_for_ms: 10000

  - id: ca-legislature-bills
    name: California Legislature bulk data (leginfo daily change files)
    url: https://downloads.leginfo.legislature.ca.gov/
    kind: state_legislation
    crawl_strategy: bulk_download
    parser: leginfo_pubinfo
    fetcher: http
    schedule: daily
    enabled: true
    verify_pattern: 'pubinfo_[A-Z][a-z]{2}\.zip'
    params:
      # leginfo.legislature.ca.gov disallows all crawlers; this download host has no robots.txt.
      # Keep bills authored by Fremont's legislators plus bills whose text mentions Fremont.
      # Districts came from the US Census geocoder over all 32 neighborhood centroids.
      assembly_district: 24
      senate_district: 10
      member_sources: [ca-assembly-members, ca-senate-members]
      mention_terms: [Fremont]

  - id: ca-assembly-members
    name: California State Assembly - members by district
    url: https://www.assembly.ca.gov/assemblymembers
    kind: reference
    crawl_strategy: single_page
    parser: assembly_members
    fetcher: http
    schedule: monthly
    enabled: true
    verify_pattern: 'assemblymembers/24\b'

  - id: ca-senate-members
    name: California State Senate - senators by district
    url: https://www.senate.ca.gov/senators
    kind: reference
    crawl_strategy: single_page
    parser: senate_members
    fetcher: http
    schedule: monthly
    enabled: true
    verify_pattern: 'data-district="10"'

  # Documents the team supplied as files (not crawled). They are loaded with the pipeline's
  # ingest_manifest action; enabled: false keeps them out of crawls.
  - id: fremont-zoning-administrator
    name: City of Fremont Zoning Administrator - agendas, correspondence and notices
    url: https://city.fremont.gov/zoningadministrator
    kind: zoning
    crawl_strategy: manual_upload
    parser: manual_upload
    enabled: false

  - id: docket-bill-research-notes
    name: Docket research notes on California bills affecting Fremont (September 13, 2026 snapshot)
    url: https://www.fremont.gov/government/legislative-affairs
    kind: state_legislation
    crawl_strategy: manual_upload
    parser: manual_upload
    enabled: false

  # News and transportation feeds (robots.txt checked 2026-09-13: Tri-City Voice allows all but
  # /blogs/* with Crawl-delay: 1; Alameda CTC allows all).
  - id: tricityvoice-news
    name: Tri-City Voice - local news naming Fremont
    url: https://www.tricityvoice.com/feed/
    kind: news
    crawl_strategy: rss_feed
    parser: rss_feed
    fetcher: http
    schedule: daily
    enabled: true
    verify_pattern: '<rss'
    params:
      mention_terms: [Fremont]
      # Sponsored "Best of" roundups and opinion columns are not news.
      exclude_category_prefixes: [best of, columns]

  - id: alameda-ctc-news
    name: Alameda County Transportation Commission (Alameda CTC) - news
    url: https://www.alamedactc.org/feed/
    kind: transportation
    crawl_strategy: rss_feed
    parser: rss_feed
    fetcher: http
    schedule: weekly
    enabled: true
    verify_pattern: '<rss'

  # ArcGIS layers (services2.arcgis.com returns 403 for robots.txt, which RFC 9309 treats as no
  # restrictions). Each query URL returns attributes only; the parser turns a layer into one document.
  - id: fremont-neighborhoods-gis
    name: City of Fremont Neighborhoods GIS layer (32 official areas)
    url: https://services2.arcgis.com/AVso4yDITKsybTJg/arcgis/rest/services/Neighborhoods/FeatureServer/0/query?where=1%3D1&outFields=NAME,REGION,HISTORIC,Acres&returnGeometry=false&orderByFields=NAME&f=json
    kind: reference
    crawl_strategy: api_query
    parser: arcgis_featureserver
    fetcher: http
    schedule: monthly
    enabled: true
    verify_pattern: '"NAME":\s*"[^"]+"'
    params:
      title: '{NAME}'
      fields: {REGION: Region, HISTORIC: Historic, Acres: Area (acres)}

  - id: fremont-zoning-gis
    name: City of Fremont Zoning Class GIS layer - zoning districts by mapped area and acreage
    # 1,788 polygons is more than one 1,000-record page, so the query groups them by district and class.
    url: https://services2.arcgis.com/AVso4yDITKsybTJg/arcgis/rest/services/Zoning_Class/FeatureServer/0/query?where=1%3D1&groupByFieldsForStatistics=ZONE_DIST,ZN_CLASS&outStatistics=%5B%7B%22statisticType%22%3A%22count%22%2C%22onStatisticField%22%3A%22OBJECTID%22%2C%22outStatisticFieldName%22%3A%22areas%22%7D%2C%7B%22statisticType%22%3A%22sum%22%2C%22onStatisticField%22%3A%22Acreage%22%2C%22outStatisticFieldName%22%3A%22acres%22%7D%5D&orderByFields=ZONE_DIST,ZN_CLASS&returnGeometry=false&f=json
    kind: zoning
    crawl_strategy: api_query
    parser: arcgis_featureserver
    fetcher: http
    schedule: monthly
    enabled: true
    verify_pattern: '"ZONE_DIST":\s*"[A-Z]'
    params:
      title: '{ZONE_DIST} (zoning class {ZN_CLASS})'
      title_fallback: 'Zoning class {ZN_CLASS} areas with no district code'
      fields: {ZN_CLASS: Zoning class, areas: Mapped areas, acres: Total acres}

  # Fremont App (CitySourced) portal API over plain HTTP (robots.txt on fremontca.citysourced.com is
  # 404, which means no restrictions). The page sets session cookies and a CSRF token; one NEARBYREQUEST
  # query then returns every request in the city, and core/citysourced.py makes one neighborhood-tagged
  # document per request. Reporter ids are never stored. Contract verified 2026-09-14.
  - id: fremont-app-requests-api
    name: Fremont App (CitySourced) - resident service requests
    url: https://fremontca.citysourced.com/servicerequests/nearby
    kind: resident_issues
    crawl_strategy: api_query
    parser: citysourced_api
    fetcher: http
    schedule: daily
    enabled: true
    verify_pattern: 'hdnCsrfToken'

  # Nixle alerts (robots.txt disallows only /region_search/ and /agency_search/, checked 2026-09-14).
  # core/nixle.py reads up to max_pages listing pages and each alert page, one document per alert.
  - id: fremont-police-nixle
    name: Fremont Police Department - Nixle alerts and press releases
    url: https://local.nixle.com/fremont-police-department-ca/
    kind: public_safety
    crawl_strategy: listing_one_level
    parser: nixle_agency
    fetcher: http
    schedule: daily
    enabled: true
    verify_pattern: 'id="pub_\d+"'
    params:
      max_pages: 10

  - id: city-of-fremont-nixle
    name: City of Fremont - Nixle notifications
    url: https://local.nixle.com/city-of-fremont/
    kind: public_safety
    crawl_strategy: listing_one_level
    parser: nixle_agency
    fetcher: http
    schedule: daily
    enabled: true
    verify_pattern: 'id="pub_\d+"'
    params:
      max_pages: 10

  # City GIS features, one document per feature (or per group_by group), tagged with the official
  # neighborhood. url is the layer metadata: discovery fails if a configured field disappears.
  # params.fields is an allowlist; only those attributes are requested or stored (never owner,
  # applicant or planner contact fields). Field names checked against the live layers 2026-09-14.
  - id: fremont-capital-projects-gis
    name: City of Fremont Capital Improvement Program projects (GIS)
    url: https://services2.arcgis.com/AVso4yDITKsybTJg/arcgis/rest/services/CIP_AllCategories_Pts/FeatureServer/0?f=json
    kind: capital_projects
    crawl_strategy: api_query
    parser: arcgis_features
    fetcher: http
    schedule: monthly
    enabled: true
    verify_pattern: '"objectIdField"'
    params:
      layer: https://services2.arcgis.com/AVso4yDITKsybTJg/arcgis/rest/services/CIP_AllCategories_Pts/FeatureServer/0
      title: '{Prj_Name}'
      title_fallback: '{CIP_Prj_Name}'
      fields:
        Prj_Name: Project
        Prj_Num: Project number
        CIP_Prj_Category: CIP category
        CIP_Prj_Name: CIP project
        CIP_Prj_Description: Description
        CIP_Notes: Notes
        Road_Name: Road
        Begin_Location: From
        End_Location: To
        CIP_URL: Project page

  - id: fremont-annual-street-programs-gis
    name: City of Fremont annual street programs - project locations (GIS)
    url: https://services2.arcgis.com/AVso4yDITKsybTJg/arcgis/rest/services/CIP6_AnnualPrograms/FeatureServer/0?f=json
    kind: capital_projects
    crawl_strategy: api_query
    parser: arcgis_features
    fetcher: http
    schedule: monthly
    enabled: true
    verify_pattern: '"objectIdField"'
    params:
      layer: https://services2.arcgis.com/AVso4yDITKsybTJg/arcgis/rest/services/CIP6_AnnualPrograms/FeatureServer/0
      title: '{CIP_Prj_Name}'
      title_fallback: 'Annual street program locations'
      group_by: [CIP_Prj_Name]
      fields:
        CIP_Prj_Name: Program
        Road_Name: Road
        Begin_Location: From
        End_Location: To
        Type: Work type
        CIP_Prj_Description: Description
        CIP_URL: Program page

  - id: fremont-development-activity-gis
    name: City of Fremont development activity - project sites (GIS)
    url: https://services2.arcgis.com/AVso4yDITKsybTJg/arcgis/rest/services/Development_Activity/FeatureServer/119?f=json
    kind: development
    crawl_strategy: api_query
    parser: arcgis_features
    fetcher: http
    schedule: monthly
    enabled: true
    verify_pattern: '"objectIdField"'
    params:
      layer: https://services2.arcgis.com/AVso4yDITKsybTJg/arcgis/rest/services/Development_Activity/FeatureServer/119
      title: '{Prj_Name}'
      title_fallback: 'Development project {Prj_Num}'
      fields:
        Prj_Name: Project
        Prj_Num: Project number
        SitusStreetNumber: Street number
        SitusStreetName: Street
        SitusZip: ZIP code
        Prj_Desc: Description
        Status: Status
        SFU_New: New single-family units
        SFU_Net: Net single-family units
        MF_TWN_New: New townhouse units
        MF_CND_New: New condominium units
        MF_Net: Net multifamily units
        Res_Net: Net residential units
        COM_New: New commercial (as recorded by the city)
        Com_Net: Net commercial (as recorded by the city)
        IND_New: New industrial (as recorded by the city)

  - id: fremont-transportation-projects-gis
    name: City of Fremont traffic corridor, bikeway and trail improvements (GIS)
    url: https://services2.arcgis.com/AVso4yDITKsybTJg/arcgis/rest/services/Traffic_Corridor_Bikeway_Trail_Improvements_2024/FeatureServer/2?f=json
    kind: transportation
    crawl_strategy: api_query
    parser: arcgis_features
    fetcher: http
    schedule: monthly
    enabled: true
    verify_pattern: '"objectIdField"'
    params:
      layer: https://services2.arcgis.com/AVso4yDITKsybTJg/arcgis/rest/services/Traffic_Corridor_Bikeway_Trail_Improvements_2024/FeatureServer/2
      title: '{Prj_Name}'
      title_fallback: '{Road_Name} corridor improvements'
      fields:
        Prj_Name: Project
        Prj_Desc: Description
        Road_Name: Road
        Begin_Location: From
        End_Location: To
        CIP_Prj_Category: CIP category
        CIP_Prj_Description: CIP description
        CIP_URL: Project page
