[project]
name = "docket-backend"
version = "0.1.0"
description = "DOCKET neighborhood civic platform API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19,<2",
    "fastapi==0.141.1",
    "firecrawl-py>=4.42.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
agent = ["strands-agents==1.55.1"]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["ruff>=0.15,<0.16", "httpx>=0.28,<0.29"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
